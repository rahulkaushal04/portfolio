<!DOCTYPE html>
<!--
  Served for any unmatched route at any depth, so relative and absolute asset
  paths are both unreliable here. Keep this page self-contained.
-->
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="robots" content="noindex, follow">

  <title>404 - Page Not Found | Rahul Kaushal</title>
  <meta name="description" content="This page does not exist. Head back to the portfolio.">
  <meta name="theme-color" content="#0B0D12">

  <style>
    :root {
      --clr-accent:      #4F8EF7;
      --clr-accent-solid: #2A66D6;
      --clr-accent-strong:#1F55BC;
      --clr-bg:          #0B0D12;
      --clr-text:        #F0F2F5;
      --clr-text-soft:   #A0A6B8;
      --clr-text-muted:  #8A91A6;
      --clr-border:      #2E323F;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;

      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.6;
      color: var(--clr-text);
      background-color: var(--clr-bg);
      -webkit-font-smoothing: antialiased;
    }

    .error-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 1.25rem;
      padding: 1.5rem;
      max-width: 34rem;
    }

    .error-page__code {
      font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", monospace;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--clr-accent);
    }

    .error-page__title {
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    .error-page__blip {
      color: var(--clr-accent);
      animation: blink 1.1s step-end infinite;
    }

    .error-page__message {
      font-size: 1.0625rem;
      color: var(--clr-text-soft);
    }

    .error-page__actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 0.75rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;

      min-height: 44px;
      padding: 0.75rem 1.5rem;

      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 0.75rem;

      transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease;
    }

    .btn--primary {
      color: #fff;
      background-color: var(--clr-accent-solid);
    }

    .btn--primary:hover { background-color: var(--clr-accent-strong); }

    .btn--outline {
      color: var(--clr-accent);
      border: 1.5px solid var(--clr-accent);
    }

    .btn--outline:hover { background-color: rgba(79, 142, 247, 0.14); }

    .btn:focus-visible {
      outline: 2px solid var(--clr-text);
      outline-offset: 3px;
    }

    .error-page__hint {
      margin-top: 0.5rem;
      font-size: 0.8125rem;
      color: var(--clr-text-muted);
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .error-page__blip { animation: none; }
      .btn { transition: none; }
    }
  </style>
</head>

<body>
  <main class="error-page">
    <p class="error-page__code">Error 404</p>

    <h1 class="error-page__title">
      This page does not exist<span class="error-page__blip" aria-hidden="true">_</span>
    </h1>

    <p class="error-page__message">
      The link may be out of date, or the page may have moved. Everything else
      is still where you left it.
    </p>

    <div class="error-page__actions">
      <!-- Absolute: the 404 can be served from any path. -->
      <a href="https://rahulkaushal04.github.io/portfolio/" class="btn btn--primary">Back to portfolio</a>
      <a href="https://rahulkaushal04.github.io/portfolio/projects.html" class="btn btn--outline">See projects</a>
    </div>

    <p class="error-page__hint">
      Or email <a href="mailto:kaushalrahul15@gmail.com" style="color:var(--clr-accent)">kaushalrahul15@gmail.com</a>
    </p>
  </main>
</body>
</html>
