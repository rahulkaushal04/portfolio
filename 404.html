<!DOCTYPE html>
<!--
  Served for any unmatched route at any depth, so relative and absolute asset
  paths are both unreliable here. Keep this page self-contained.
-->
<html lang="en" data-theme="professional">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="robots" content="noindex, follow">

  <title>404 - Page Not Found | Rahul Kaushal</title>
  <meta name="description" content="This page does not exist. Head back to the portfolio.">
  <meta name="theme-color" content="#0B0D12">

  <script>
    /* Same saved choice as the main site; no external fonts so this page stays self-contained. */
    (function () {
      var d = document.documentElement, t, m;
      try { t = localStorage.getItem('rk-theme'); m = localStorage.getItem('rk-mode'); } catch (e) {}
      if (['retro', 'professional', 'hallownest', 'souls', 'grandline'].indexOf(t) < 0) t = 'professional';
      if (t === 'professional') {
        if (m !== 'light' && m !== 'dark') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        d.setAttribute('data-mode', m);
      }
      d.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    :root {
      --clr-accent:      #4F8EF7;
      --clr-accent-solid: #2A66D6;
      --clr-accent-strong:#1F55BC;
      --clr-bg:          #0B0D12;
      --clr-text:        #F0F2F5;
      --clr-text-soft:   #A0A6B8;
      --clr-text-muted:  #8A91A6;
      --clr-border:      #2E323F;
    }


    html[data-theme="professional"] { --clr-bg: #f3f5f4; --clr-text: #121614; --clr-text-soft: #4a524d; --clr-text-muted: #4a524d; --clr-border: #d5dad6; --clr-accent: #0b6b5b; --clr-accent-solid: #0b6b5b; --clr-accent-strong: #095446; --clr-on-accent: #fff; }
    html[data-theme="professional"][data-mode="dark"] { --clr-bg: #0f1311; --clr-text: #e6ebe7; --clr-text-soft: #a3ada7; --clr-text-muted: #a3ada7; --clr-border: #2a312d; --clr-accent: #5fd3b0; --clr-accent-solid: #5fd3b0; --clr-accent-strong: #8be3c8; --clr-on-accent: #07120e; }
    html[data-theme="retro"] { --clr-bg: #0e7c86; --clr-text: #fff; --clr-text-soft: #fff; --clr-text-muted: #fff; --clr-border: #fff; --clr-accent: #fff; --clr-accent-solid: #000080; --clr-accent-strong: #0000a8; --clr-on-accent: #fff; }
    html[data-theme="hallownest"] { --clr-bg: #070a12; --clr-text: #e9eef2; --clr-text-soft: #a9b4c2; --clr-text-muted: #a9b4c2; --clr-border: #1d2638; --clr-accent: #8fd3ff; --clr-accent-solid: #8fd3ff; --clr-accent-strong: #b5e3ff; --clr-on-accent: #04121c; }
    html[data-theme="souls"] { --clr-bg: #0c0a08; --clr-text: #d8cdb4; --clr-text-soft: #a89c82; --clr-text-muted: #a89c82; --clr-border: #2e261c; --clr-accent: #c9a24b; --clr-accent-solid: #c9a24b; --clr-accent-strong: #dcb85f; --clr-on-accent: #1a1205; }
    html[data-theme="grandline"] { --clr-bg: #f2e3bf; --clr-text: #14110f; --clr-text-soft: #4a3f33; --clr-text-muted: #4a3f33; --clr-border: #14110f; --clr-accent: #0b3c6b; --clr-accent-solid: #0b3c6b; --clr-accent-strong: #082c50; --clr-on-accent: #fff6dc; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;

      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.6;
      color: var(--clr-text);
      background-color: var(--clr-bg);
      -webkit-font-smoothing: antialiased;
    }

    .error-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 1.25rem;
      padding: 1.5rem;
      max-width: 34rem;
    }

    .error-page__code {
      font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", monospace;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--clr-accent);
    }

    .error-page__title {
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    .error-page__blip {
      color: var(--clr-accent);
      animation: blink 1.1s step-end infinite;
    }

    .error-page__message {
      font-size: 1.0625rem;
      color: var(--clr-text-soft);
    }

    .error-page__actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 0.75rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;

      min-height: 44px;
      padding: 0.75rem 1.5rem;

      font-size: 0.875rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 0.75rem;

      transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease;
    }

    .btn--primary {
      color: var(--clr-on-accent, #fff);
      background-color: var(--clr-accent-solid);
    }

    .btn--primary:hover { background-color: var(--clr-accent-strong); }

    .btn--outline {
      color: var(--clr-accent);
      border: 1.5px solid var(--clr-accent);
    }

    .btn--outline:hover { background-color: color-mix(in srgb, var(--clr-accent) 16%, transparent); }

    .btn:focus-visible {
      outline: 2px solid var(--clr-text);
      outline-offset: 3px;
    }

    .error-page__hint {
      margin-top: 0.5rem;
      font-size: 0.8125rem;
      color: var(--clr-text-muted);
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .error-page__blip { animation: none; }
      .btn { transition: none; }
    }
  </style>
</head>

<body>
  <main class="error-page">
    <p class="error-page__code">Error 404</p>

    <h1 class="error-page__title">
      This page does not exist<span class="error-page__blip" aria-hidden="true">_</span>
    </h1>

    <p class="error-page__message">
      The link may be out of date, or the page may have moved. Everything else
      is still where you left it.
    </p>

    <div class="error-page__actions">
      <!-- Absolute: the 404 can be served from any path. -->
      <a href="https://rahulkaushal04.github.io/portfolio/" class="btn btn--primary">Back to portfolio</a>
      <a href="https://rahulkaushal04.github.io/portfolio/projects.html" class="btn btn--outline">See projects</a>
    </div>

    <p class="error-page__hint">
      Or email <a href="mailto:kaushalrahul15@gmail.com" style="color:var(--clr-accent)">kaushalrahul15@gmail.com</a>
    </p>
  </main>
</body>
</html>
